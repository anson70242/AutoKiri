    accounts:
      - platform: "youtube"
        channel_id: "UCdvq5i3RyRsoTqITD1xSxNw"

      - platform: "twitch"
        channel_name: "柊優花 (hiiragiyukaofficial)"
        
  - name: "Haru"
    accounts:
      - platform: "youtube"
        channel_id: "UCrOV-crqUmRluPVOjjVs-Xw"

      - platform: "twitcast"
        channel_name: "shino_nome22"

      - platform: "twitter"
        channel_id: "shino_haru101"

  - name: "Kanon"
    accounts:
      - platform: "youtube"
        channel_id: "UCGvqjigtg9uGXHwqT27wS9A"

  - name: "Yuno"
    accounts:
      - platform: "youtube"
        channel_id: "UC99kOG6_9RD0mR3OG4EOfxw"

  - name: "Nonoka"
    accounts:
      - platform: "youtube"
        channel_id: "UCGeCnpimiSN5rgiKbJzHd3A"
  

whisper:
  language: "ja"
  model: "large-v3-turbo"
  compute_type: "float16"
  beam_size: 5
  vad_filter: False
  condition_on_previous_text: False
  no_speech_threshold: 0.5
  vad_threshold: 0.35
  vad_min_speech_duration_ms: 250

prompts:
  # 路径相对于项目根目录
  # Gemini 相关提示词
  speech_analyze: "src/highlight_cliper/prompt/speech_analyze.md"
  to_excel: "src/highlight_cliper/prompt/to_excel.md"
  # LLM 字幕翻译相关
  translater: "src/agents/prompts/translater.md"
  translater_glossary: "src/agents/prompts/vocab.md"

agents:
  # LLM 字幕翻译器配置
  # 端点与密钥统一放在 .env：AUTOKIRI_LLM_BASE_URL / AUTOKIRI_LLM_API_KEY
  # （如需覆盖模型也可在 .env 设 AUTOKIRI_LLM_MODEL）
  - translater:
      model: "unsloth/Qwen3.6-27B-GGUF:UD-Q4_K_XL"
      chunk_size: 50
      overlap: 5

tools_paths:
  # 注意：程序会自动在以下路径前加上 /tools/ 文件夹名
  yt_dlp: "yt-dlp/yt-dlp.exe"
  twitch_downloader_cli: "TwitchDownloaderCLI/TwitchDownloaderCLI.exe"
  ffmpeg: "ffmpeg-8.0.1-essentials_build/bin/ffmpeg.exe"
  ffprobe: "ffmpeg-8.0.1-essentials_build/bin/ffprobe.exe"
  node: "node-v24.13.1-win-x64/node.exe"
  npm: "node-v24.13.1-win-x64/npm.cmd"
  faster_whisper: "Faster-Whisper-XXL/faster-whisper-xxl.exe"